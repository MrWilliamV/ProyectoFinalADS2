{% load static %}
<html data-theme="light">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{% static 'dist/styles.css' %}">
    <title>Iniciar sesión</title>
</head>
<body class="min-h-screen flex items-center justify-center ">

<img src="{% static 'img/Logo.png' %}" class="h-1/2 rounded-4xl p-1.5">

<div class="card bg-base-100 w-96 shadow-sm p-1.5">
    <div class="card-body p-1.5">
        <h2 class="card-title">Iniciar sesion</h2>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% load widget_tweaks %}

            {{ form.username.label_tag }}
            <label class="floating-label py-2">
                {{ form.username|add_class:"input input-md w-full" }}
            </label>

            {{ form.password.label_tag }}
            <label class="floating-label py-2">
                {{ form.password|add_class:"input input-md w-full" }}
            </label>

            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}


            <button class="btn btn-primary w-full px-2" type="submit">Entrar</button>

            {% if form.errors %}
            <p style="color:red;">Usuario o contraseña inválidos.</p>
            {% endif %}
        </form>

    </div>
</div>

</body>
</html>

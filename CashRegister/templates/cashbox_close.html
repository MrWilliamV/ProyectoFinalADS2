{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Cerrar caja</h1>

<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <p><b>Bloque:</b> {{ session.get_block_display }}</p>
    <p><b>Efectivo esperado:</b> Q {{ expected }}</p>
    <form method="post" class="mt-4">
      {% csrf_token %}
      <label class="form-control">
        <div class="label"><span class="label-text">Efectivo contado (Q)</span></div>
        <input type="number" step="0.01" min="0" name="counted_cash" class="input input-bordered w-full" required>
      </label>
      <div class="card-actions justify-end mt-4">
        <button class="btn btn-warning" type="submit">Confirmar cierre</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
